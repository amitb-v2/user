# -----------------------------------------------------------------------------
# Microservice Deploy — Docker build -> AWS ECR -> EC2 (via SSM)
# -----------------------------------------------------------------------------
# Trigger: push to master (or run manually from the Actions tab).
#
# Flow:
#   1. Build this repository's Docker image.
#   2. Make sure the ECR repository exists and keeps only the latest 5 images.
#   3. Push the image to ECR (tags: <commit sha> and latest).
#   4. Over SSM, on the EC2 instance: pull the new image and recreate ONLY
#      this service with the existing docker-compose.yml + override.
#      Other services keep running untouched (--no-deps).
#
# Per-repository values: SERVICE_NAME, ECR_REPOSITORY, DOCKERFILE_PATH, BUILD_CONTEXT.
#
# AWS credentials (set in GitHub -> Settings -> Secrets and variables -> Actions):
#   Option A (OIDC, preferred): variable AWS_DEPLOY_ROLE_ARN
#   Option B (access keys):     secrets AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY
# -----------------------------------------------------------------------------

name: Deploy to EC2

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  id-token: write   # OIDC login to AWS
  contents: read

# Never run two deployments of the same service at once.
concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 370180090626.dkr.ecr.us-east-1.amazonaws.com
  EC2_INSTANCE_ID: i-0d749035d946d750a
  DEPLOYMENT_DIR: /home/ec2-user/weave-socks

  # --- per-repository values ---
  SERVICE_NAME: user                            # service name in docker-compose.yml
  ECR_REPOSITORY: weave-socks/user              # must match the image in docker-compose.override.yml
  DOCKERFILE_PATH: docker/user/Dockerfile-release
  BUILD_CONTEXT: .

jobs:

  build-and-push:
    name: Build and Push to ECR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Ensure ECR repository and lifecycle policy
        run: |
          if ! aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" >/dev/null 2>&1; then
            echo "Creating ECR repository $ECR_REPOSITORY"
            aws ecr create-repository --repository-name "$ECR_REPOSITORY" >/dev/null
          fi

          # Keep only the newest 5 images. An image tagged both <sha> and
          # latest counts once.
          aws ecr put-lifecycle-policy \
            --repository-name "$ECR_REPOSITORY" \
            --lifecycle-policy-text '{
              "rules": [{
                "rulePriority": 1,
                "description": "Keep only the latest 5 images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 5
                },
                "action": { "type": "expire" }
              }]
            }' >/dev/null

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The EC2 instance is x86 (t3a), so build linux/amd64.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.BUILD_CONTEXT }}
          file: ${{ env.DOCKERFILE_PATH }}
          push: true
          platforms: linux/amd64
          provenance: false   # keep one image per push so the 5-image limit is accurate
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Send deploy command via SSM
        id: ssm
        run: |
          # Script that runs on the EC2 instance (as root, via SSM).
          cat > deploy.sh <<EOF
          set -euo pipefail
          cd "${DEPLOYMENT_DIR}"

          if docker compose version >/dev/null 2>&1; then
            COMPOSE="docker compose"
          else
            COMPOSE="docker-compose"
          fi

          aws ecr get-login-password --region "${AWS_REGION}" \
            | docker login --username AWS --password-stdin "${ECR_REGISTRY}"

          # The compose files must point this service at the ECR image,
          # otherwise pull/up would silently redeploy the old image.
          CONFIGURED=\$(\$COMPOSE config | awk '
            \$0 == "  ${SERVICE_NAME}:" { in_svc = 1; next }
            in_svc && /^  [^ ]/        { in_svc = 0 }
            in_svc && /^    image:/    { print \$2 }')
          echo "Image configured for ${SERVICE_NAME}: \$CONFIGURED"
          if [ "\$CONFIGURED" != "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest" ]; then
            echo "ERROR: ${SERVICE_NAME} is not configured to use ${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"
            echo "Add it as the image in docker-compose.override.yml on the server."
            exit 1
          fi

          # Pull and recreate ONLY this service; --no-deps leaves others alone.
          \$COMPOSE pull "${SERVICE_NAME}"
          \$COMPOSE up -d --no-deps "${SERVICE_NAME}"
          \$COMPOSE ps "${SERVICE_NAME}"
          EOF

          # Build the SSM parameters as JSON (avoids shell-quoting problems).
          jq -n --rawfile script deploy.sh \
            '{commands: ($script | split("\n")), workingDirectory: ["/"], executionTimeout: ["900"]}' \
            > params.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${SERVICE_NAME} ${GITHUB_SHA::7}" \
            --parameters file://params.json \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command: $COMMAND_ID"
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment
        run: |
          COMMAND_ID="${{ steps.ssm.outputs.command_id }}"

          # Poll for up to 15 minutes.
          for i in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "Status: $STATUS"
            case "$STATUS" in
              Success|Failed|TimedOut|Cancelled|Cancelling) break ;;
            esac
            sleep 10
          done

          echo "----- output from EC2 -----"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "[StandardOutputContent, StandardErrorContent]" \
            --output text || true

          if [ "$STATUS" != "Success" ]; then
            echo "::error::Deployment finished with status: $STATUS"
            exit 1
          fi
          echo "Deployment succeeded"
